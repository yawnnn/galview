[package]
name = "galview"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = { git = "https://github.com/yawnnn/egui.git", branch = "main" } 
egui = { git = "https://github.com/yawnnn/egui.git", branch = "main" } 
egui_extras = { git = "https://github.com/yawnnn/egui.git", branch = "main", features = ["file", "gif", "image", "svg", "webp"] }
image = { version = "0.25" }
log = "0.4.29"
env_logger = "0.11.10"

[profile.release]
debug = true